name: example
description: "An example Flutter project using the dartblock_code package."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^13.3.0
  flutter_riverpod: ^3.4.3
  google_fonts: ^9.0.0
  json_annotation: ^4.12.0
  dartblock_code:
    path: ../

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/dartblockEvaluatorSamples/
    - assets/dartblockSamples/
